<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" fill="none">
  <defs>
    <linearGradient id="canvas" x1="100" y1="40" x2="1210" y2="1060" gradientUnits="userSpaceOnUse"><stop stop-color="#062D24"/><stop offset=".48" stop-color="#126448"/><stop offset="1" stop-color="#062D24"/></linearGradient>
    <linearGradient id="ribbon" x1="720" y1="0" x2="1280" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#21875B"/><stop offset=".5" stop-color="#126448"/><stop offset="1" stop-color="#0B4435"/></linearGradient>
    <linearGradient id="sweep" x1="160" y1="430" x2="1090" y2="1050" gradientUnits="userSpaceOnUse"><stop stop-color="#126448"/><stop offset=".52" stop-color="#21875B"/><stop offset=".8" stop-color="#43A86B"/><stop offset="1" stop-color="#126448"/></linearGradient>
    <linearGradient id="lower" x1="120" y1="740" x2="1020" y2="1100" gradientUnits="userSpaceOnUse"><stop stop-color="#0B4435"/><stop offset=".55" stop-color="#126448"/><stop offset="1" stop-color="#062D24"/></linearGradient>
    <linearGradient id="front" x1="200" y1="900" x2="920" y2="1080" gradientUnits="userSpaceOnUse"><stop stop-color="#21875B"/><stop offset="1" stop-color="#0B4435"/></linearGradient>
    <radialGradient id="shade"><stop stop-color="#062D24" stop-opacity=".65"/><stop offset="1" stop-color="#062D24" stop-opacity="0"/></radialGradient>
    <radialGradient id="light"><stop stop-color="#D9F5DF" stop-opacity=".65"/><stop offset=".16" stop-color="#D9F5DF" stop-opacity=".25"/><stop offset="1" stop-color="#43A86B" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3M0 12 12 0M9 15 15 9" stroke="#D9F5DF" stroke-width="1"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#D9F5DF"/></pattern>
  </defs>
  <style>@media(max-width:600px){.detail{display:none}.hatching{opacity:.15}}</style>
  <path fill="url(#canvas)" d="M0 0h1560v1000H0z"/>
  <!-- An inward fold leaves a deep evergreen pocket at the upper right. -->
  <path d="M660-100C780 20 615 116 766 212C902 298 1002 124 1158 170C1350 227 1350 445 1640 402V-100Z" fill="url(#ribbon)"/>
  <ellipse cx="1280" cy="130" rx="380" ry="220" fill="url(#shade)"/>
  <circle class="hatching" cx="280" cy="420" r="130" fill="url(#hatch)" opacity=".27"/>
  <!-- Broad asymmetrical sweep, with its bright turn below the content area. -->
  <path d="M-100 454C90 306 193 464 384 492C595 523 754 443 938 575C1130 712 1025 904 1295 1090H-100Z" fill="url(#sweep)"/>
  <circle class="hatching" cx="1480" cy="580" r="173" fill="url(#hatch)" opacity=".3"/>
  <path d="M-90 770C118 570 224 757 420 736C619 715 716 869 890 905C1100 948 1250 888 1640 1050H-90Z" fill="url(#lower)"/>
  <path d="M-100 916C83 770 190 857 318 886C482 923 516 842 689 935C814 1001 959 982 1110 1080H-100Z" fill="url(#front)"/>
  <path d="M-70 1020C97 870 201 999 360 985C485 972 564 1006 650 1090H-70Z" fill="#0B4435"/>
  <g class="detail">
    <path d="M-22 831h210v138H-22z" fill="url(#dots)" opacity=".45"/>
    <path d="M686 85h194v12H686zM1230 851h194v12h-194z" fill="url(#dots)" opacity=".5"/>
    <g stroke="#D9F5DF" stroke-width="1.5" opacity=".16">
      <circle cx="106" cy="170" r="13"/><circle cx="1418" cy="325" r="9"/>
      <path d="m151 673 17-27 17 27zM1330 947l19-30 19 30z"/>
      <rect x="476" y="75" width="15" height="15" rx="1" transform="rotate(20 476 75)"/><rect x="1510" y="778" width="18" height="18" rx="1"/>
    </g>
    <g fill="url(#light)"><circle cx="174" cy="261" r="22"/><circle cx="1250" cy="100" r="20"/><circle cx="1450" cy="760" r="22"/><circle cx="564" cy="909" r="18"/></g>
    <g fill="#D9F5DF" opacity=".7"><circle cx="174" cy="261" r="1.5"/><circle cx="1250" cy="100" r="1.3"/><circle cx="1450" cy="760" r="1.5"/><circle cx="564" cy="909" r="1.3"/></g>
  </g>
</svg>

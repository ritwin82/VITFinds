name: Verify and deploy VITFinds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Test and build
        run: |
          npm test
          npm run build
          sam validate --lint --template-file aws/template.yaml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: vitfinds-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/setup-sam@v2
      - name: Assume VITFinds deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::159596244653:role/vitfinds-github-deploy
          aws-region: ap-south-1
          allowed-account-ids: '159596244653'
      - name: Build and deploy backend
        run: |
          npm run build
          cd aws
          sam deploy \
            --template-file template.yaml \
            --stack-name vitfinds \
            --region ap-south-1 \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-ztslgm3kwfwm \
            --s3-prefix vitfinds \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides UniversityDomains=gmail.com \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Configure and upload frontend
        run: |
          node scripts/configure-aws.mjs vitfinds ap-south-1
          SITE_BUCKET=$(aws cloudformation describe-stacks --stack-name vitfinds --region ap-south-1 --query "Stacks[0].Outputs[?OutputKey=='SiteBucket'].OutputValue | [0]" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name vitfinds --region ap-south-1 --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" --output text)
          SITE_URL=$(aws cloudformation describe-stacks --stack-name vitfinds --region ap-south-1 --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" --output text)
          test -n "$SITE_BUCKET" && test "$SITE_BUCKET" != None
          test -n "$DISTRIBUTION_ID" && test "$DISTRIBUTION_ID" != None
          aws s3 sync dist/ "s3://$SITE_BUCKET" --region ap-south-1
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
          echo "Deployed $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VITFinds student lost and found and marketplace
Parameters:
  UniversityDomains:
    Type: String
    Default: vitstudent.ac.in
    Description: Comma-separated approved university email domains
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-origin'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: Site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: Site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 31536000
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  BeforeSignUp:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: presignup.handler
      Runtime: nodejs22.x
      Timeout: 5
      Environment:
        Variables:
          UNIVERSITY_DOMAINS: !Ref UniversityDomains
  Students:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      LambdaConfig:
        PreSignUp: !GetAtt BeforeSignUp.Arn
  SignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeforeSignUp
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt Students.Arn
  StudentClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Students
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
  Admins:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref Students
      GroupName: Admins
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, OPTIONS]
      Auth:
        DefaultAuthorizer: StudentAuth
        Authorizers:
          StudentAuth:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Students}'
              audience:
                - !Ref StudentClient
  Backend:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: handler.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Data
          SITE_BUCKET: !Ref SiteBucket
          UNIVERSITY_DOMAINS: !Ref UniversityDomains
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Data
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${SiteBucket.Arn}/uploads/*'
      Events:
        ApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/api/{proxy+}'
            Method: ANY
  BackendLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Backend}'
      RetentionInDays: 14
Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  UserPoolId:
    Value: !Ref Students
  UserPoolClientId:
    Value: !Ref StudentClient
  Region:
    Value: !Ref AWS::Region

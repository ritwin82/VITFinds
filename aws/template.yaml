AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VITFinds student lost and found and marketplace
Parameters:
  UniversityDomains:
    Type: String
    Default: vitstudent.ac.in
    Description: Comma-separated approved university email domains
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-origin'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: Site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: Site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 31536000
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  RealtimeTickets:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticket
          AttributeType: S
      KeySchema:
        - AttributeName: ticket
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  RealtimeConnections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByUser
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-realtime'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'
  RealtimeAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: realtime.authorize
      Runtime: nodejs22.x
      Environment:
        Variables:
          TICKET_TABLE: !Ref RealtimeTickets
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RealtimeTickets
  RealtimeConnectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: realtime.connection
      Runtime: nodejs22.x
      Environment:
        Variables:
          CONNECTION_TABLE: !Ref RealtimeConnections
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RealtimeConnections
  RealtimeAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      AuthorizerType: REQUEST
      Name: TicketAuthorizer
      IdentitySource:
        - route.request.querystring.ticket
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RealtimeAuthorizerFunction.Arn}/invocations'
  RealtimeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RealtimeConnectionFunction.Arn}/invocations'
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$connect'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref RealtimeAuthorizer
      Target: !Sub 'integrations/${RealtimeIntegration}'
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$disconnect'
      Target: !Sub 'integrations/${RealtimeIntegration}'
  RealtimeStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ConnectRoute, DisconnectRoute]
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: live
      AutoDeploy: true
  RealtimeAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/authorizers/${RealtimeAuthorizer}'
  RealtimeConnectionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeConnectionFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
  BeforeSignUp:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: presignup.handler
      Runtime: nodejs22.x
      Timeout: 5
      Environment:
        Variables:
          UNIVERSITY_DOMAINS: !Ref UniversityDomains
  Students:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      LambdaConfig:
        PreSignUp: !GetAtt BeforeSignUp.Arn
  SignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeforeSignUp
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt Students.Arn
  StudentClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Students
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
  Admins:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref Students
      GroupName: Admins
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, OPTIONS]
      Auth:
        DefaultAuthorizer: StudentAuth
        Authorizers:
          StudentAuth:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Students}'
              audience:
                - !Ref StudentClient
  Backend:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-build/
      Handler: handler.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Data
          SITE_BUCKET: !Ref SiteBucket
          UNIVERSITY_DOMAINS: !Ref UniversityDomains
          TICKET_TABLE: !Ref RealtimeTickets
          CONNECTION_TABLE: !Ref RealtimeConnections
          WS_MANAGEMENT_URL: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/live'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Data
        - DynamoDBCrudPolicy:
            TableName: !Ref RealtimeTickets
        - DynamoDBCrudPolicy:
            TableName: !Ref RealtimeConnections
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/live/POST/@connections/*'
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${SiteBucket.Arn}/uploads/*'
      Events:
        ApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/api/{proxy+}'
            Method: ANY
  BackendLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Backend}'
      RetentionInDays: 14
Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  WebSocketUrl:
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/live'
  UserPoolId:
    Value: !Ref Students
  UserPoolClientId:
    Value: !Ref StudentClient
  Region:
    Value: !Ref AWS::Region
